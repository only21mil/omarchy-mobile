# Swap on zram at half the RAM, the size stock Android runs on the Pixel 9a.
# Omarchy 4.5's 90-omarchy.conf (with zram-generator, which it adds on
# aarch64) sets zram-size = ram, and that hung the 9a under load where half
# the RAM took 5 GB more with no OOM kill (device/tegu/NOTES.md, 2026-11-08).
# zram-generator reads its drop-ins in file name order across /usr/lib,
# /usr/local/lib, /etc and /run, the latest name winning
# (zram-generator.conf(5)): 95 comes after Omarchy's 90 and before the
# /etc/systemd/zram-generator.conf.d/99-local.conf that Omarchy points users
# to for their own settings. Omarchy's algorithm and priority stand.
# Inert while zram-generator isn't installed (Omarchy 4.0.6).
[zram0]
zram-size = ram / 2
